# fta-pipe.config.yaml
# Configuration file for Fast Transient Analysis Pipeline module installation using 
#    cosipy Python virtual environment
# This file is stored in env/. hot_load_module.sh detects *.config.yaml files
# both in the module root and in the module env/ directory.
#
# Usage examples:
#   - Install with config: ./hot_load_module.sh <module> install
#   - Override config: ./hot_load_module.sh <module> install -e -E env1,env2

# ==============================================================================
# Installation Options
# ==============================================================================
# install_mode: environment
#   - "container": Only build Docker image (equivalent to -f flag)
#   - "environment": Only create Python virtual environments (equivalent to -e flag)
#   - "both": Build Docker image AND create environments (equivalent to -a flag)
#   - "none": Skip installation (only link DAGs and pipeline)
install_mode: both

# ==============================================================================
# Paths Configuration
# ==============================================================================
# All paths are relative to module root unless they start with /
paths:
  # Path to DAGs directory (default: src/dags)
  dags: src/dags
  
  # Path to pipeline scripts directory (default: src/pipeline)
  pipeline: src/pipeline
  
  # Path to Docker context directory containing Dockerfile (default: env)
  images: env

# ==============================================================================
# Python Virtual Environments
# ==============================================================================
environments:
  # Environment 1: Stable cosipy environment for GeD/COSIpy analysis tasks
  cosipy:
    requirements: env/requirements_cosipy.txt
    venv_path: /home/gamma/envs/cosipy
    enabled: true
    description: "Stable cosipy environment for GeD/COSIpy analysis"
    python_version: "3.12"

  # Environment 2: BCT/GDT environment for Bayesian Blocks duration and BGO localization
  bct:
    requirements: env/requirements_bct.txt
    #requirements_no_deps: env/requirements_bct_nodeps.txt
    venv_path: /home/gamma/envs/bct
    enabled: true
    description: "BCT/GDT environment for duration and BGO localization"
    python_version: "3.11"

  # Environment 3: COSIpy non-imaging environment for BGO localization
  nimcosipy:
    requirements: env/requirements_nimcosipy.txt
    venv_path: /home/gamma/envs/nimcosipy
    enabled: true
    description: "COSIpy non-imaging environment for BGO localization"
    python_version: "3.12"
  
# Default environment to use if none specified
default_environment: cosipy
